# alembic.ini
# ===========
# Alembic configuration file.
# This file is read by the `alembic` command-line tool.
# The `sqlalchemy.url` here is the FALLBACK — the production value is read
# from the DATABASE_URL environment variable inside alembic/env.py.

[alembic]
# Path to the alembic migrations directory (relative to this file)
script_location = alembic

# sys.path is prepended with this path so that `src.api.db.models` can be
# imported during `alembic revision --autogenerate`.
prepend_sys_path = .

# Separator used between migration version segments (os = os.sep)
version_path_separator = os

# Default URL — overridden in env.py via os.getenv("DATABASE_URL")
sqlalchemy.url = postgresql+asyncpg://deepcoin:deepcoin@localhost:5432/deepcoin

# Disable Alembic's own timezone-naive datetime warnings —
# all our columns use DateTime(timezone=True).
timezone = UTC


# ── Logging configuration ────────────────────────────────────────────────────
# Alembic uses standard Python logging.  These settings give clean output
# during `alembic upgrade head` and `alembic downgrade`.

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
