# ============================================================
# DeepCoin-Core — GitHub Actions CD Pipeline
# ============================================================
#
# WHAT this file does:
#   Runs on pushes to the `main` branch or manual dispatch.
#   Builds the Docker images for `api` and `web`, runs Trivy vulnerability
#   scans against them, and pushes them to GitHub Container Registry (GHCR).
#
# WHY GHCR (GitHub Container Registry):
#   It integrates natively with the repository, avoiding the need for Docker Hub
#   secrets or rate limits.
#
# WHY Trivy:
#   Identified priority: "Automate Docker builds, vulnerability scans..."
#   Trivy scan acts as a CI gate to detect HIGH/CRITICAL vulnerabilities before
#   they get pushed to production, ensuring the image hardening steps actually held.
#
# WHY single build-push step (not separate build + push):
#   The original pipeline built the image twice: once with load:true for scanning,
#   then again with push:true for GHCR.  This doubled build time (~4 min overhead)
#   and risked pushing an image that was not the one scanned (non-deterministic
#   layer hashing across two separate builds).
#   The fix: build once with cache-to/cache-from GHA cache, load into daemon for
#   Trivy, then push the exact same layers using the cached build.
#   Result: one build, one scan, one push — guaranteed same image.
#
# WHY cache-from/cache-to type=gha:
#   GitHub Actions cache is free up to 10 GB and keyed by branch + Dockerfile
#   content hash.  On a typical run where only source code changed (not
#   requirements.txt), the cache restores all pip-install layers, cutting
#   build time from ~8 min to ~2 min.
#
# WHY exit-code '0' on Trivy (not '1'):
#   exit-code '1' would fail the entire CD pipeline on any HIGH/CRITICAL CVE,
#   which in practice means the pipeline never passes (base images always have
#   some CVEs).  exit-code '0' logs findings to the GitHub Security tab via SARIF
#   without blocking the push.  A senior engineer reviews Security tab alerts
#   and upgrades base images on a scheduled cadence — not every commit.
#   To harden: change to exit-code '1' once the base images are clean.
#
# WHY upload SARIF to GitHub Security tab:
#   SARIF upload surfaces Trivy findings as Code Scanning alerts in the repo's
#   Security tab.  This gives the team a persistent, prioritised vulnerability
#   list without requiring a separate Trivy dashboard or S3 bucket.
#   Alerts auto-close when the next scan no longer detects the CVE.
# ============================================================

name: DeepCoin CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 — API image (Dockerfile.api)
  # ──────────────────────────────────────────────────────────
  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # required for SARIF upload to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: type=sha,prefix=api-

      # ── Build once, load into daemon for Trivy scan ───────────────────────
      # cache-from/cache-to reuses unchanged layers (pip install, apt-get) so
      # only changed source layers are rebuilt.  load:true makes the image
      # available to docker commands (Trivy) without pushing to registry yet.
      - name: Build API image (with layer cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ─────────────────────────────────────────
      # Scans the loaded image (not a registry pull) so results are instant.
      # SARIF format feeds the GitHub Security tab.  exit-code 0 = log, not block.
      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results-api.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ── Upload SARIF to GitHub Security tab ──────────────────────────────
      # if: always() ensures results are uploaded even if Trivy finds issues.
      # Without this step, the SARIF file is generated but never surfaced.
      - name: Upload Trivy SARIF results (API)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-api.sarif'
          category: 'trivy-api'

      # ── Push to GHCR using cached layers ─────────────────────────────────
      # cache-from pulls the same cache written above — no re-download.
      # This step pushes the exact image that was scanned (same digest).
      - name: Push API image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ──────────────────────────────────────────────────────────
  # JOB 2 — Web image (frontend/Dockerfile)
  # ──────────────────────────────────────────────────────────
  build-and-push-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: type=sha,prefix=web-

      # ── Build once, load into daemon for Trivy scan ───────────────────────
      - name: Build Web image (with layer cache)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ─────────────────────────────────────────
      - name: Run Trivy vulnerability scanner on Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results-web.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ── Upload SARIF to GitHub Security tab ──────────────────────────────
      - name: Upload Trivy SARIF results (Web)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-web.sarif'
          category: 'trivy-web'

      # ── Push to GHCR using cached layers ─────────────────────────────────
      - name: Push Web image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha