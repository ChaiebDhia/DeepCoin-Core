[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "deepcoin-core"
version     = "0.4.0"
description = "End-to-end archaeological coin classification: CNN + multi-agent AI + RAG"
readme      = "README.md"
license     = { text = "MIT" }
authors     = [{ name = "Dhia Chaieb", email = "dhia.chaieb@esprit.tn" }]
keywords    = ["numismatics", "deep-learning", "rag", "agents", "efficientnet"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core runtime dependencies — mirrors requirements.txt
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "opencv-python>=4.10.0",
    "albumentations>=1.4.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.5.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "langchain>=0.3.0",
    "langgraph>=0.3.0",
    "openai>=1.60.0",
    "fpdf2>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "tqdm>=4.67.0",
    "requests>=2.32.0",
    "slowapi>=0.1.9",
    "python-json-logger>=3.0.0",   # P11 — structured JSON logging
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",           # FastAPI TestClient + ASGITransport
    "aiosqlite>=0.20.0",       # SQLite async driver for integration tests (replaces PostgreSQL)
    "black>=24.0.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.0",    # stricter linting rules
]

# ── Tool configurations ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Where to find tests
testpaths    = ["tests"]
# Show all output, don't capture
addopts      = "-v --tb=short"
# pytest-asyncio: auto mode so every async def test_* is treated as asyncio test
# WHY auto: avoids having to add @pytest.mark.asyncio to every async test function.
#           The decorator is error-prone — it is easy to forget and the test
#           silently passes without running any assertions.
asyncio_mode = "auto"
# Treat warnings as non-fatal (some deps emit DeprecationWarning)
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length    = 110
target-version = ["py311"]
# Exclude autogenerated / vendor directories
exclude = '''
/(
    \.git
  | venv
  | __pycache__
  | data
  | models
  | reports
)/
'''

[tool.flake8]
# Keep in sync with black line length
max-line-length    = 110
# Ignore:
#   E203 — whitespace before ':' (black-formatted slices)
#   W503 — line break before binary operator (black prefers this)
#   E501 — long lines (handled by black)
extend-ignore      = [
    "E203", "W503", "E501",
    # Relaxed visual/styling formatting
    "E221", "E222", "E231", "E251", "E261", "E272", "E128",
    # Blank lines and whitespaces
    "E302", "E303", "E305", "W291", "W292", "W293", "W391",
    # Imports and definitions
    "E401", "E402", "F401", "F811", "F841", "E741",
    # FastAPI dependency injection (Depends, Header, etc. inside defaults)
    "B008"
]
exclude            = ["venv", "data", "models", ".git", "__pycache__"]
per-file-ignores   = [
    # Test files: allow assert statements and unused imports
    "tests/*:S101,F401",
]
