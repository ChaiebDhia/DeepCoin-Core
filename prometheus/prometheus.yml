global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:8000']
    bearer_token_file: '/tmp/prometheus/api_token'
rule_files:
  - "/etc/prometheus/rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
