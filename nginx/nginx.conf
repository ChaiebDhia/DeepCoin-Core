# nginx/nginx.conf
# =================
# Nginx 1.27 reverse proxy for the DeepCoin stack.
#
# Routing rules:
#   /api/auth/*   → web:3000   (NextAuth.js — must go to Next.js, NOT FastAPI)
#   /api/*        → api:8000   (FastAPI endpoints)
#   /*            → web:3000   (Next.js pages + assets)
#
# WHY Nginx in front of both services:
#   1. Single public port (80 / 443) — only Nginx is exposed to the host.
#      Docker Compose "expose" makes api:8000 and web:3000 private (container-only).
#   2. TLS termination — in production add a certbot sidecar or replace the
#      self_signed cert with Let's Encrypt.  Nginx handles SSL; app containers
#      speak plain HTTP internally.
#   3. Static asset caching — Nginx caches /api/reports/* PDFs with long TTL.
#   4. Rate limiting — global burst protection before requests reach FastAPI or Next.js.
#
# WHY NOT use Next.js rewrites for /api → FastAPI in production:
#   Next.js rewrites work for development (hot-reload, Turbopack).
#   In production (standalone build), they still work but add ~1ms overhead
#   and complicate container networking.  Nginx handles routing at the OS level.
#
# TLS NOTE:
#   The HTTPS server block is commented out.  To enable TLS:
#     1. Add a certbot/acme companion service to docker-compose.yml
#     2. Mount certs into /etc/nginx/ssl/
#     3. Uncomment the ssl_certificate lines below

worker_processes  auto;                  # one worker per CPU core

events {
    worker_connections  1024;            # max concurrent connections per worker
    use epoll;                           # Linux kernel I/O multiplexing
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" "$http_x_request_id"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile           on;               # kernel-level file send (zero-copy)
    tcp_nopush         on;               # batch TCP packets (pairs with sendfile)
    tcp_nodelay        on;               # disable Nagle for low-latency responses
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;              # hide nginx version from error responses

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Rate limiting ──────────────────────────────────────────────────────
    # 10 req/s per IP for API calls (burst allows short spikes before 429)
    # WHY here as well as FastAPI's slowapi:
    #   Nginx limit fires BEFORE the request reaches Python — zero CPU cost.
    #   slowapi is the final guardrail for requests that slip through.
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=classify_limit:10m  rate=5r/m;

    # ── Buffer sizes for large ML API responses ────────────────────────────
    # classify endpoint JSON response can be ~30 KB (narrative + top-5 table)
    proxy_buffer_size          16k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;

    client_max_body_size       15m;      # allow up to 15 MB uploads (coin photos)

    # ── Upstream definitions ───────────────────────────────────────────────
    upstream fastapi_upstream {
        server  api:8000;
        # WHY single server (no load balancing):
        #   Only ONE FastAPI worker loads the GPU model (asyncio.Semaphore(1)).
        #   Adding more servers here without also increasing workers would
        #   route to dead capacity.  Scale via container replicas + separate
        #   upstream entries when upgrading the infrastructure.
        keepalive  32;                   # reuse TCP connections to FastAPI
    }

    upstream nextjs_upstream {
        server  web:3000;
        keepalive  32;
    }

    # ── Shared proxy headers ───────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── HTTP server ────────────────────────────────────────────────────────
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;                  # accept any hostname

        # In production: redirect HTTP → HTTPS
        # Uncomment this block and comment out the location blocks below:
        # return 301 https://$host$request_uri;

        # ── Security headers (Nginx level) ───────────────────────────────
        add_header  X-Frame-Options         "DENY"                    always;
        add_header  X-Content-Type-Options  "nosniff"                 always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  X-Request-ID            $request_id               always;

        # ── NextAuth routes ──────────────────────────────────────────────
        # CRITICAL: /api/auth/* must go to Next.js, not FastAPI.
        # NextAuth handles /api/auth/signin, /api/auth/session, /api/auth/csrf
        # These are Next.js API routes created by the [...nextauth]/route.ts file.
        location /api/auth/ {
            proxy_pass         http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   X-Request-ID      $request_id;
        }

        # ── FastAPI routes ───────────────────────────────────────────────
        location /auth/ {
            limit_req  zone=api_limit  burst=20  nodelay;
            limit_req_status  429;
            proxy_pass         http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_set_header   X-Request-ID      $request_id;
            proxy_read_timeout 120s;
        }

        location /api/classify {
            # Strict rate limit on the expensive AI pipeline
            limit_req  zone=classify_limit  burst=2  nodelay;
            limit_req_status  429;

            proxy_pass          http://fastapi_upstream;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";         # disable keepalive for long requests
            proxy_set_header    X-Request-ID      $request_id;

            # Generous timeout for the 15–60 s LLM narrative generation
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 10s;

            # No buffering — stream the response as FastAPI emits it
            proxy_buffering  off;
            proxy_request_buffering  off;
        }

        location /api/ {
            limit_req  zone=api_limit  burst=20  nodelay;
            limit_req_status  429;

            proxy_pass         http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_set_header   X-Request-ID      $request_id;
            proxy_read_timeout 120s;
        }

        # ── PDF report downloads ─────────────────────────────────────────
        location /api/reports/ {
            proxy_pass         http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host  $host;

            # Cache PDFs for 1 hour at the Nginx level
            proxy_cache_valid  200  1h;
            add_header         Cache-Control "public, max-age=3600, immutable";
        }

        # ── Next.js static assets ────────────────────────────────────────
        location /_next/static/ {
            proxy_pass         http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host  $host;

            # Browser caches static assets for 1 year (fingerprinted filenames)
            add_header  Cache-Control "public, max-age=31536000, immutable";
        }

        # ── All other routes → Next.js ───────────────────────────────────
        location / {
            proxy_pass         http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   X-Request-ID      $request_id;
        }
    }

    # ── HTTPS server (uncomment for production TLS) ────────────────────────
    # server {
    #     listen      443 ssl http2;
    #     listen      [::]:443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... same location blocks as HTTP server above ...
    # }
}
